# Qualcomm Glymur CRD on the meta-qcom CI qcom-multimedia-image for
# glymur-crd (stock firmware). Only what the tests cannot discover.
name: glymur-crd

lava:
  device_type: glymur-crd
  image_dir: qcom-multimedia-image-glymur-crd
  # boot firmware on SPI NOR, then the root file system on NVMe
  flash:
    - {path: spinor, storage: spinor, firehose: xbl_s_devprg_ns.melf, rawprogram: [rawprogram0.xml], patch: [patch0.xml]}
    - {storage: nvme, firehose: xbl_s_devprg_ns.melf, rawprogram: [rawprogram0.xml], patch: [patch0.xml]}
  prompt: 'root@glymur-crd'
  firmware_fingerprint: false
  backstop: false
  priority: medium

display:
  compositor: weston

modules:
  audioreach: false

absent:
  primary-display: the primary display type of this board is not characterised in this profile
  audio-routes: the speaker and microphone routes of this board are not characterised in this profile
  audio-loopback: no speaker-to-microphone loopback is characterised for this board
  camera-raw-graph: no media graph setup for a raw capture is characterised for this board
  audio-analyzer: no calibrated audio measurement path on the lab boards

