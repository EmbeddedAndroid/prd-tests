# Virtual board: Linux virtual drivers in a QEMU VM (tools/vm/run.sh):
# vkms (KMS with overlay, cursor and writeback planes), vimc (media
# controller camera pipeline), vicodec (FWHT stateful codec), vivid
# (V4L2 capture), snd-aloop (ALSA loopback card), swtpm (TPM 2.0), and
# Weston on vkms with the Mesa software renderer.
name: virtual

display:
  primary: Virtual
  # no systemd in the VM: the runner starts Weston itself
  compositor_cmd: >-
    mkdir -p /tmp/prd-xdg && chmod 700 /tmp/prd-xdg &&
    XDG_RUNTIME_DIR=/tmp/prd-xdg exec seatd-launch -- weston --backend=drm
    --socket=wayland-1 --continue-without-input --log=/tmp/prd-weston.log
  wayland: {runtime_dir: /tmp/prd-xdg, display: wayland-1}
  software_gl: true

audio:
  card: Loopback
  # snd-aloop: what plays on device 0 is captured on device 1
  play: {device: 0}
  capture: {device: 1}
  loopback: {freq: 1000, min_db: 15}

camera:
  raw:
    setup:
      - '-V ''"Sensor A":0[fmt:SBGGR8_1X8/640x480]'''
    video: Raw Capture 0
    pixelformat: BA81
    width: 640
    height: 480

platform: {}

# What a QEMU virt machine and these drivers do not provide.
absent:
  HDMI-A: the VM has only the vkms virtual connector
  DP: the VM has only the vkms virtual connector
  DSI: the VM has only the vkms virtual connector
  edid: the vkms connector reports no EDID
  displays-2: vkms is set up with one output
  displays-3: vkms is set up with one output
  backlight: no panel in the VM
  touch: no touch device in the VM
  audio-analyzer: a loopback card has no analog path to measure
  audio-dsp: no audio DSP in the VM
  audio-play2: snd-aloop substreams are separate loops, not mixed
  audio-mute: snd-aloop has no mute route
  audio-volume: snd-aloop has no volume control
  audio-routes: no shell audio cases are characterised for snd-aloop
  camx: the VM has no CamX camera stack (a Qualcomm image with CamX and modules.camx enables these tests)
  compress-offload: snd-aloop has no compress offload device
  ucm: snd-aloop has no UCM configuration
  pipewire: no PipeWire daemon runs in the VM
  video-decoder-H264: vicodec codes FWHT only
  video-encoder-H264: vicodec codes FWHT only
  video-decoder-HEVC: vicodec codes FWHT only
  video-encoder-HEVC: vicodec codes FWHT only
  video-decoder-VP90: vicodec codes FWHT only
  video-decoder-AV01: vicodec codes FWHT only
  gst-v4l2-decoder-FWHT: GStreamer has no v4l2 element for FWHT
  gst-v4l2-encoder-FWHT: GStreamer has no v4l2 element for FWHT
  gst-v4l2-decoder-H264: vicodec codes FWHT only, so GStreamer has no v4l2 H.264 decoder
  gst-v4l2-encoder-H264: vicodec codes FWHT only, so GStreamer has no v4l2 H.264 encoder
  tee: no TEE in the VM
  remoteproc: no remote processors in the VM
  thermal: no thermal zones in a QEMU virt machine
  sleep-stats: no low power statistics in the VM

# requirements that need no hardware, so they may pass in the bare VM
hardware_free:
  GVI-009: GStreamer element inventory, user space only
  GVI-027: its element inventory half is user space only; the HLS half skips without a codec

# fails accepted on this board, each with the reason (tools/vm/expect.py):
# what vkms, snd-aloop and libcamera 0.2 in Ubuntu 24.04 do not do
known_fail:
  GDS-010: vkms planes do not scale (the atomic check returns ERANGE)
  GDS-012: vkms has no mutable zpos, so the stacking order is fixed
  GDS-014: vkms in Linux 6.8 takes no YUV plane format
  GDS-018: vkms in Linux 6.8 gives reflect-y, rotate-90 and rotate-180 captures that differ from the DRM rotation definition; the same test verifies all of them on msm DPU
  GDS-019: vkms offers linear buffers only
  GDS-021: vkms has a gamma LUT but no degamma LUT
  GDS-022: vkms has no colour transform matrix
  GDS-023: the vkms connector has no max bpc property
  GDS-024: vkms has no variable refresh rate
  GDS-025: vkms encoders list only themselves in possible_clones, so the virtual connector and writeback cannot share a CRTC
  GDS-029: a VM boots without a boot loader framebuffer
  GDS-042: vkms has no colour transform matrix
  GDS-046: vkms connectors have no HDR_OUTPUT_METADATA property
  GDS-049: vkms in Linux 6.8 has no plane colour pipeline (COLOR_PIPELINE)
  GAU-017: alsabat's round trip asks snd-aloop for a period equal to its 16-frame buffer, which snd-aloop refuses
  GVI-015: the vicodec FWHT encoder has no frame skip mode control
  GVI-016: the vicodec FWHT encoder has no intra refresh period control
  GVI-017: the vicodec FWHT encoder has no long term reference controls
  GVI-018: the vicodec FWHT encoder has no slice partitioning controls
  GVI-019: the vicodec FWHT encoder has no hierarchical coding controls
  GVI-022: the vicodec FWHT encoder has no rotate or flip controls
  GCA-005: libcamerasrc (libcamera 0.2) on vimc with the software ISP delivers one buffer and stalls; cam captures from the same camera (GCA-004)
  GCA-012: libcamerasrc stalls on vimc as in GCA-005; cam captures from the same camera
