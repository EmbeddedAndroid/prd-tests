    args: {caps: 'video/x-h264,width=640,height=360', codec: H264, expect_height: 360, expect_width: 640}
  VID-016:
    title: "VP9 Non-secure playback"
    tests:
    - {args: {codec: VP90, role: decoder}, test: video.codec}
    - {args: {codec: VP90, vector: vp90-2-08-tile-4x4.webm}, test: video.decode_vector}
  VID-017:
    title: "Rotation/Flip"
    tests:
    - {args: {names: [rotate, horizontal_flip, vertical_flip]}, test: video.controls}
