    args: {paths: [/lib/firmware/qcom/*/*adsp*, /lib/firmware/qcom/*/*/*adsp*, /lib/firmware/qcom/*/*tplg*, /lib/firmware/qcom/*/*/*tplg*]}
  VID-001:
    title: "Maximum number of combined encoding and decoding instances"
    test: video.concurrent
    args: {mix: decode+encode, sessions: 2}
    target: "none"
  VID-002:
    title: "H.264 Non-secure playback"
    tests:
    - {args: {codec: H264, role: decoder}, test: video.codec}
    - {args: {codec: H264, vector: BA1_Sony_D.jsv}, test: video.decode_vector}
  VID-003:
    title: "H.265 Non-secure Playback"
    tests:
    - {args: {codec: HEVC, role: decoder}, test: video.codec}
    - {args: {codec: HEVC, vector: AMP_A_Samsung_7.bin}, test: video.decode_vector}
  VID-004:
    title: "H.264 Encoder"
    tests:
    - {args: {codec: H264, role: encoder}, test: video.codec}
    - {args: {codec: H264, height: 1080, width: 1920}, test: video.roundtrip}
  VID-005:
    title: "H.265 Encoder"
    tests:
    - {args: {codec: HEVC, role: encoder}, test: video.codec}
    - {args: {codec: HEVC, height: 1080, width: 1920}, test: video.roundtrip}
  VID-006:
    title: "BackChannel Support"
    test: platform.no_interface
    args: {feature: Wi-Fi Display back channel (source), interface: no Wi-Fi Display (Miracast) session manager on the image, look: [/usr/bin/*wfd*, /usr/lib/*wfd*, /usr/bin/*miracast*]}
  VID-007:
    title: "Frame Skipping"
    test: video.controls
    args: {names: [frame_skip_mode]}
  VID-008:
    title: "BackChannel Support"
    test: platform.no_interface
    args: {feature: Wi-Fi Display back channel (sink), interface: no Wi-Fi Display (Miracast) session manager on the image, look: [/usr/bin/*wfd*, /usr/lib/*wfd*, /usr/bin/*miracast*]}
  VID-009:
    title: "Intra Refresh Support"
    tests:
    - {args: {names: [intra_refresh_period]}, test: video.controls}
    - {args: {codec: H264, controls: 'video_gop_size=1000,intra_refresh_period=10'}, test: video.roundtrip}
  VID-010:
    title: "WiFi Display Rx"
    test: platform.no_interface
    args: {feature: Wi-Fi Display sink, interface: no Wi-Fi Display (Miracast) session manager on the image, look: [/usr/bin/*wfd*, /usr/lib/*wfd*, /usr/bin/*miracast*]}
  VID-011:
    title: "RTCP Support"
