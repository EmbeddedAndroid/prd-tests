# Eliza product requirements mapped to the generic tests.
# Neutral requirement IDs; title as in the requirement list. Each entry
# names a test (or several: "tests") with its arguments and an optional
# target on the measurements; target "none" means the requirement
# states no number, so a pass is reported as partial. See README.md.
product: eliza
title: Eliza (Qualcomm Eliza SoC) product requirements
areas: {DSP: display, AUD: audio, VID: video, CAM: camera}
requirements:
  DSP-001:
    title: "Weston Compositor for Upstream"
    test: display.wayland_gl
    args: {version: Mesa}
    note: "upstream GPU stack: Mesa"
  DSP-002:
    title: "Weston Compositor for Downstream"
    test: display.wayland_gl
    args: {version: '^(?!.*Mesa).+'}
    note: "downstream GPU stack: passes only with a GL driver that is not Mesa"
  DSP-003:
    title: "Color Depth"
    test: display.connector_property
    args: {commit: true, connector: primary, feature: Colour depth, names: [max bpc]}
    target: {max_bpc: 10}
  DSP-004:
    title: "MIPI DSI link max bit rate"
    test: display.connector
    args: {connector: DSI}
    target: "none"
    note: "link and bit clock rate not measured"
  DSP-005:
    title: "MIPI controller max bit clock"
    test: display.connector
    args: {connector: DSI}
    target: "none"
    note: "link and bit clock rate not measured"
  DSP-006:
    title: "Video Mode Panel Support"
    test: display.connector
    args: {connector: DSI}
  DSP-007:
    title: "HDMI Support"
    test: display.modeset
    args: {connector: HDMI-A, mode: preferred}
  DSP-008:
    title: "Max Resolution and refresh rates - 2D"
    test: display.modes
    args: {connector: HDMI-A}
    target: "none"
  DSP-009:
    title: "HDCP for HDMI"
    test: display.connector_property
    args: {connector: HDMI-A, feature: HDCP on HDMI, names: [Content Protection]}
  DSP-010:
    title: "Video Format Timing"
    test: display.modes
    args: {connector: HDMI-A}
    target: "none"
  DSP-011:
    title: "Output pixel format"
    test: display.connector_property
    args: {connector: HDMI-A, feature: HDMI output pixel format, names: [Colorspace, color format, output format]}
  DSP-012:
    title: "Color Depth"
    test: display.connector_property
    args: {commit: true, connector: HDMI-A, feature: HDMI colour depth, names: [max bpc]}
    target: {max_bpc: 10}
  DSP-013:
    title: "EDID/DDC"
    test: display.edid
    args: {connector: HDMI-A}
  DSP-014:
    title: "HDMI Detection"
    test: display.hotplug
    args: {connector: HDMI-A}
  DSP-015:
    title: "Configuration #1: Highest resolution primary display only"
    test: display.modeset
    args: {connector: primary, mode: highest}
    target: "none"
  DSP-016:
    title: "Configuration #2: Highest resolution primary + external [interface]"
    test: display.multi
    args: {n: 2}
  DSP-017:
    title: "Configuration #3: Highest resolution primary + secondary + external"
    test: display.multi
    args: {n: 3}
  DSP-018:
    title: "Number of video layers"
    test: display.layers
    target: "none"
  DSP-019:
    title: "Color Space Conversion"
    test: display.csc
  DSP-020:
    title: "Dithering"
    test: display.property
    args: {feature: Dithering, names: [DITHER, dither], obj: crtc}
  DSP-021:
    title: "Source Cropping"
    test: display.crop
  DSP-022:
    title: "Memory Color"
    test: platform.no_interface
    args: {feature: Memory colour, interface: the DRM colour management API has no memory colour (hue/saturation zone) property}
  DSP-023:
    title: "Writeback path"
    test: display.writeback
  DSP-024:
    title: "Picture Control Block (DSPP)"
    test: display.crtc_lut
    # saturation 0 as a CTM (BT.709 luma rows): (200,100,50) -> grey 118
    args:
      prop: CTM
      ctm: [0.2126, 0.7152, 0.0722, 0.2126, 0.7152, 0.0722, 0.2126, 0.7152, 0.0722]
      want: [118, 118, 118]
      uncovered: "hue, intensity and contrast controls (KMS has no HSIC property; DSP-045)"
  DSP-025:
    title: "Arbitrary alignment of video/graphic layers"
    test: display.position
  DSP-026:
    title: "No constraints on blend ordering"
    test: display.zorder
  DSP-027:
    title: "Per-Pixel/Source/Destination/Constant/alpha blending"
    test: display.alpha
  DSP-028:
    title: "Display Stream Compression (DSC)"
    test: display.connector
    args: {connector: DSI}
    note: "DSC needs a DSC sink: a DSC DSI panel or DP monitor"
  DSP-029:
    title: "Brightness Control"
    test: display.backlight
  DSP-030:
    title: "Dynamic calculation of DSI bitclk according to Display Panel parameters"
    test: display.connector
    args: {connector: DSI}
  DSP-031:
    title: "Variable Refresh Rate"
    test: display.vrr
  DSP-032:
    title: "Display Support on Apps Bootloader (UEFI)"
    test: display.boot_handoff
  DSP-033:
    title: "Max display resolution in the various voltage corners"
    test: display.summary
    args: {what: Maximum resolution per voltage corner}
  DSP-034:
    title: "Display Source Processing - Scaling"
    test: display.scale
  DSP-035:
    title: "Dual DSI for a single panel"
    test: display.connector
    args: {connector: DSI}
  DSP-036:
    title: "Maximum frame width"
    test: display.max_width
    target: "none"
  DSP-037:
    title: "Universal Bandwidth Compression"
    test: display.modifiers
    args: {vendor: QCOM}
  DSP-038:
    title: "Dynamic Display detect/config"
    test: display.connector
    args: {connector: DSI}
  DSP-039:
    title: "Display Post Processing Content Adaptive Backlight Control (DSPP)"
    test: platform.no_interface
    args: {feature: Content adaptive backlight control, interface: no KMS or backlight class property for content adaptive backlight control}
  DSP-040:
    title: "Display Post Processing Panel Color Correction (DSPP)"
    test: display.crtc_lut
    args: {prop: CTM}
  DSP-041:
    title: "Display Post Processing Gamut mapping (DSPP)"
    test: display.property
    args: {feature: Gamut mapping (3D LUT), names: [GAMUT_3DLUT, LUT3D, 3D_LUT], obj: crtc}
  DSP-042:
    title: "Display Post Processing Inverse Gamma Correction (DSPP)"
    test: display.crtc_lut
    args: {prop: DEGAMMA_LUT}
  DSP-043:
    title: "Display Post Processing Panel Gamma Correction (DSPP)"
    test: display.crtc_lut
    args: {prop: GAMMA_LUT}
  DSP-044:
    title: "Display Post Processing Dither (DSPP)"
    test: display.property
    args: {feature: Colour block dither, names: [DITHER, dither], obj: crtc}
  DSP-045:
    title: "Display Post Processing Picture Adjustment (DSPP)"
    test: platform.no_interface
    args: {feature: 'Picture adjustment (hue, saturation, value, contrast)', interface: the DRM colour management API has no picture adjustment property}
  DSP-046:
    title: "Enable support for panels used for internal platforms"
    test: display.connector
    args: {connector: DSI}
  DSP-047:
    title: "Destination Scaler & Sharpening"
    test: platform.no_interface
    args: {feature: Destination scaler and sharpening, interface: KMS has no destination scaler or sharpening property}
  DSP-048:
    title: "10-bit DSI Output"
    test: display.connector
    args: {connector: DSI}
  DSP-049:
    title: "Concurrent write back"
    test: display.clone_writeback
    args: {connector: HDMI-A}
  DSP-050:
    title: "Support for Adaptive V-Sync Refresh (Q-Sync)"
    test: display.vrr
  DSP-051:
    title: "SSC Support on MIPI"
    test: display.connector
    args: {connector: DSI}
  DSP-052:
    title: "DisplayPort resolution support"
    test: display.modes
    args: {connector: DP}
    target: "none"
  DSP-053:
    title: "DisplayPort MST support"
    test: display.connector
    args: {connector: DP}
  DSP-054:
    title: "DisplayPort + USB concurrency"
    test: display.connector
    args: {connector: DP}
  DSP-055:
    title: "DisplayPort Link Rate"
    test: display.connector
    args: {connector: DP}
  DSP-056:
    title: "HDR10 for embedded panel"
    test: display.property
    args: {feature: HDR output metadata, names: [HDR_OUTPUT_METADATA], obj: connector}
  DSP-057:
    title: "HDR10 for external displays"
    test: display.property
    args: {feature: HDR output metadata, names: [HDR_OUTPUT_METADATA], obj: connector}
  DSP-058:
    title: "HDR10 for external displays through HDMI"
    test: display.connector_property
    args: {connector: HDMI-A, feature: HDR10 over HDMI, names: [HDR_OUTPUT_METADATA]}
  DSP-059:
    title: "HDCP for DisplayPort"
    test: display.connector_property
    args: {connector: DP, feature: HDCP on DisplayPort, names: [Content Protection]}
  DSP-060:
    title: "DisplayPort basic audio pass-through support"
    test: display.connector
    args: {connector: DP}
  DSP-061:
    title: "Number of RGB layers"
    test: display.layers
    target: "none"
  DSP-062:
    title: "Maximum Layers mixed/blended in HW"
    test: display.layers
    target: "none"
  DSP-063:
    title: "Inline-Rotation"
    test: display.rotation
  DSP-064:
    title: "Display Panel Calibration Support"
    test: platform.no_interface
    args: {feature: Display panel calibration, interface: no standard Linux interface for panel calibration}
  DSP-065:
    title: "Display Tuning Support"
    test: platform.no_interface
    args: {feature: Display tuning, interface: no standard Linux interface for display tuning}
  DSP-066:
    title: "Compression support over DisplayPort"
    test: display.connector
    args: {connector: DP}
  DSP-067:
    title: "Display Source Processing - Sharpening (SSPP)"
    test: display.property
    args: {feature: Source sharpening, names: [SHARPNESS, sharpness], obj: plane}
  DSP-068:
    title: "Input surface formats"
    test: display.formats
  DSP-069:
    title: "Output surfaces formats"
    test: display.wb_formats
  DSP-070:
    title: "HDR10+ for embedded panel"
    test: display.property
    args: {feature: HDR output metadata, names: [HDR_OUTPUT_METADATA], obj: connector}
  DSP-071:
    title: "HDR10+ for external panel"
    test: display.property
    args: {feature: HDR output metadata, names: [HDR_OUTPUT_METADATA], obj: connector}
  DSP-072:
    title: "Mixed color gamut content support"
    test: display.property
    args: {feature: Per-plane colour pipeline (mixed gamut), names: [COLOR_PIPELINE], obj: plane}
  DSP-073:
    title: "Legacy Touch Support (I2C, I3C)"
    test: display.touch
  DSP-074:
    title: "Rounded corners/notches/cut-out"
    test: platform.no_interface
    args: {feature: Rounded corners and cut-outs, interface: KMS has no rounded corner or cut-out mask property}
  DSP-075:
    title: "Display interface configuration"
    test: display.summary
    args: {what: Display interface configuration}
  DSP-076:
    title: "ROI based concurrent writeback"
    test: platform.no_interface
    args: {feature: ROI based concurrent writeback, interface: the KMS writeback connector captures the full frame; it has no region of interest property}
  DSP-077:
    title: "Number of RGB layers"
    test: display.layers
    target: "none"
  DSP-078:
    title: "Number of RGB layers"
    test: display.layers
    target: "none"
  DSP-079:
    title: "DPU based video playback enhancements"
    test: platform.no_interface
    args: {feature: Display engine video playback enhancements, interface: KMS has no video enhancement property}
  DSP-080:
    title: "Custom Blend Layers"
    test: display.alpha
  DSP-081:
    title: "Dolby Vision HDR"
    test: display.property
    args: {feature: HDR output metadata, names: [HDR_OUTPUT_METADATA], obj: connector}
  DSP-082:
    title: "HDR Vivid"
    test: display.property
    args: {feature: HDR output metadata, names: [HDR_OUTPUT_METADATA], obj: connector}
  DSP-083:
    title: "Histogram Calculator"
    test: display.property
    args: {feature: Histogram, names: [HISTOGRAM, histogram], obj: crtc}
  DSP-084:
    title: "Power and Performance optimal composition policies"
    test: platform.no_interface
    args: {feature: Power and performance composition policy, interface: a compositor policy with no defined target; Weston has no display engine aware policy}
  DSP-085:
    title: "DP as Primary Display"
    test: display.connector
    args: {connector: DP}
  DSP-086:
    title: "DP output format"
    test: display.connector_property
    args: {connector: DP, feature: DP output format, names: [Colorspace, output format]}
  DSP-087:
    title: "DSI Output Format"
    test: display.connector
    args: {connector: DSI}
  DSP-088:
    title: "HDMI v2.1 optional features"
    test: display.connector_property
    args: {connector: HDMI-A, feature: HDMI 2.1 optional features, names: [vrr_capable, content type, HDR_OUTPUT_METADATA]}
  DSP-089:
    title: "Upstream Linux Display Drivers"
    test: platform.in_tree
    args: {cls: drm}
  AUD-001:
    title: "Multiband DRC (MBDRC)"
    test: audio.controls
    args: {feature: Multiband DRC, patterns: [MBDRC, 'multi.?band']}
  AUD-002:
    title: "Volume Control - Basic"
    test: audio.case
    args: {case: volume}
  AUD-003:
    title: "Audio SoundWire"
    test: audio.case
    args: {case: soundwire}
  AUD-004:
    title: "Mono Noise Suppression"
    test: audioreach.usecase
    args: {feature: Mono noise suppression, pattern: ECNS|_NS_}
  AUD-005:
    title: "Dynamic Range Control (DRC)"
    test: audio.controls
    args: {feature: Dynamic range control, patterns: [\bDRC\b]}
  AUD-006:
    title: "Dual-Mic ECNS"
    test: audioreach.usecase
    args: {feature: Dual-mic ECNS, pattern: 'DUAL_?MIC_?ECNS|ECNS_?DUAL'}
  AUD-007:
    title: "Multi-Mic ECNS"
    test: audioreach.usecase
    args: {feature: Multi-mic ECNS, pattern: '(MULTI|TRI|QUAD)_?MIC_?ECNS'}
  AUD-008:
    title: "TDM/PCM"
    test: audio.case
    args: {case: interface-tdm}
  AUD-009:
