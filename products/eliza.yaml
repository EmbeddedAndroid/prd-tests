    test: audio.controls
    args: {feature: Speaker protection (VI feedback), patterns: [VISENSE, 'VI ?SENSE']}
  AUD-025:
    title: "Cold Start Output Latency"
    test: audio.output_latency
    args: {kind: cold}
    target: "none"
  AUD-026:
    title: "Continuous Output Latency"
