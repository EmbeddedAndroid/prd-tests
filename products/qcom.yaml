# Qualcomm product: interfaces and features only Qualcomm stacks have
# (remote processors and DSP restart, FastRPC, AudioReach/PAL graphs
# and calibration, compress offload, vendor display properties and
# modifiers, the downstream GL driver, CamX, low power islands), features
# no standard Linux interface exposes, and the quality KPIs. Rows say
# what to measure; numbers a SoC or board must reach go in the board
# profile (targets.<ID>). The same rows run on every Qualcomm board, on
# real boards only (LAVA), next to products/generic.yaml.
product: qcom
title: Qualcomm-specific interfaces and KPIs
missing: skip
areas: {QDS: display, QAU: audio, QVI: video, QCA: camera, QPL: platform}
requirements:
  QDS-001:
    title: "Wayland compositor with EGL on a GL driver that is not Mesa"
    test: display.wayland_gl
    args: {version: '^(?!.*Mesa).+'}
  QDS-002:
    title: "Dithering property"
    test: display.property
    args: {feature: Dithering, names: [DITHER, dither], obj: crtc}
  QDS-003:
    title: "Memory colour"
    test: platform.no_interface
    args: {feature: Memory colour, interface: the DRM colour management API has no memory colour (hue/saturation zone) property}
  QDS-004:
    title: "Display inventory: maximum resolution per voltage corner"
    test: display.summary
    args: {what: Maximum resolution per voltage corner}
  QDS-005:
    title: "Vendor framebuffer modifiers (QCOM)"
    test: display.modifiers
    args: {vendor: QCOM}
  QDS-006:
    title: "Content adaptive backlight control"
    test: platform.no_interface
    args: {feature: Content adaptive backlight control, interface: no KMS or backlight class property for content adaptive backlight control}
  QDS-007:
    title: "Gamut mapping (3D LUT) property"
    test: display.property
    args: {feature: Gamut mapping (3D LUT), names: [GAMUT_3DLUT, LUT3D, 3D_LUT], obj: crtc}
  QDS-008:
    title: "Colour block dither property"
    test: display.property
    args: {feature: Colour block dither, names: [DITHER, dither], obj: crtc}
  QDS-009:
    title: "Picture adjustment (hue, saturation, value, contrast)"
    test: platform.no_interface
    args: {feature: 'Picture adjustment (hue, saturation, value, contrast)', interface: the DRM colour management API has no picture adjustment property}
  QDS-010:
    title: "Destination scaler and sharpening"
    test: platform.no_interface
    args: {feature: Destination scaler and sharpening, interface: KMS has no destination scaler or sharpening property}
  QDS-011:
    title: "Display panel calibration"
    test: platform.no_interface
    args: {feature: Display panel calibration, interface: no standard Linux interface for panel calibration}
  QDS-012:
    title: "Display tuning"
    test: platform.no_interface
    args: {feature: Display tuning, interface: no standard Linux interface for display tuning}
  QDS-013:
    title: "Source sharpening property"
    test: display.property
    args: {feature: Source sharpening, names: [SHARPNESS, sharpness], obj: plane}
  QDS-014:
    title: "Rounded corners and cut-outs"
    test: platform.no_interface
    args: {feature: Rounded corners and cut-outs, interface: KMS has no rounded corner or cut-out mask property}
  QDS-015:
    title: "ROI based concurrent writeback"
    test: platform.no_interface
    args: {feature: ROI based concurrent writeback, interface: the KMS writeback connector captures the full frame; it has no region of interest property}
  QDS-016:
    title: "Display engine video playback enhancements"
    test: platform.no_interface
    args: {feature: Display engine video playback enhancements, interface: KMS has no video enhancement property}
  QDS-017:
    title: "Histogram property"
    test: display.property
    args: {feature: Histogram, names: [HISTOGRAM, histogram], obj: crtc}
  QDS-018:
    title: "Power and performance composition policy"
    test: platform.no_interface
    args: {feature: Power and performance composition policy, interface: a compositor policy with no defined target; Weston has no display engine aware policy}
  QAU-001:
    title: "Compress offload (MP3)"
    test: audio.compress_codec
    args: {codec: MP3}
  QAU-002:
    title: "Audio DSP restart"
    test: audio.ssr
  QAU-003:
    title: "Analog quality KPI"
    test: audio.quality
    args: {what: playback THD+N}
  QAU-004:
    title: "Multiband DRC"
    test: audio.controls
    args: {feature: Multiband DRC, patterns: [MBDRC, 'multi.?band']}
  QAU-005:
    title: "AudioReach usecase: Mono noise suppression"
    test: audioreach.usecase
    args: {feature: Mono noise suppression, pattern: ECNS|_NS_}
  QAU-006:
    title: "Dynamic range control"
    test: audio.controls
    args: {feature: Dynamic range control, patterns: [\bDRC\b]}
  QAU-007:
    title: "AudioReach usecase: Dual-mic ECNS"
    test: audioreach.usecase
    args: {feature: Dual-mic ECNS, pattern: 'DUAL_?MIC_?ECNS|ECNS_?DUAL'}
  QAU-008:
    title: "AudioReach usecase: Multi-mic ECNS"
    test: audioreach.usecase
    args: {feature: Multi-mic ECNS, pattern: '(MULTI|TRI|QUAD)_?MIC_?ECNS'}
  QAU-009:
    title: "Compress offload playback (shell case)"
    test: audio.case
    args: {case: compress}
  QAU-010:
    title: "Audio calibration database (ACDB)"
    test: audioreach.acdb
  QAU-011:
    title: "AudioReach usecase: Single-mic ECNS"
    test: audioreach.usecase
    args: {feature: Single-mic ECNS, pattern: ECNS}
  QAU-012:
    title: "QACT: calibration transport"
    test: audioreach.qact
  QAU-013:
    title: "Compress offload (ALAC)"
    test: audio.compress_codec
    args: {codec: ALAC}
  QAU-014:
    title: "Speaker protection (VI feedback)"
    test: audio.controls
    args: {feature: Speaker protection (VI feedback), patterns: [VISENSE, 'VI ?SENSE']}
  QAU-015:
    title: "Audio quality KPI: playback PEAQ"
    test: audio.quality
    args: {what: playback PEAQ}
  QAU-016:
    title: "Audio quality KPI: playback noise"
    test: audio.quality
    args: {what: playback noise}
  QAU-017:
    title: "Audio quality KPI: playback dynamic range"
    test: audio.quality
    args: {what: playback dynamic range}
  QAU-018:
    title: "Audio quality KPI: playback SNR"
    test: audio.quality
    args: {what: playback SNR}
  QAU-019:
    title: "Audio quality KPI: playback click and pop"
    test: audio.quality
    args: {what: playback click and pop}
  QAU-020:
    title: "Audio quality KPI: playback maximum output power"
    test: audio.quality
    args: {what: playback maximum output power}
  QAU-021:
    title: "Audio quality KPI: playback frequency response"
    test: audio.quality
    args: {what: playback frequency response}
  QAU-022:
    title: "Audio quality KPI: record THD+N"
    test: audio.quality
    args: {what: record THD+N}
  QAU-023:
    title: "Audio quality KPI: record SNR"
    test: audio.quality
    args: {what: record SNR}
  QAU-024:
    title: "Audio quality KPI: record click and pop"
    test: audio.quality
    args: {what: record click and pop}
  QAU-025:
    title: "Audio quality KPI: record frequency response"
    test: audio.quality
    args: {what: record frequency response}
  QAU-026:
    title: "Compress offload (AAC-LC)"
    test: audio.compress_codec
    args: {codec: AAC, label: AAC-LC}
  QAU-027:
    title: "Compress offload (HE-AAC v1)"
    test: audio.compress_codec
    args: {codec: AAC, label: HE-AAC v1}
  QAU-028:
    title: "Compress offload (HE-AAC v2)"
    test: audio.compress_codec
    args: {codec: AAC, label: HE-AAC v2}
  QAU-029:
    title: "Compress offload (AAC-ELD)"
    test: audio.compress_codec
    args: {codec: AAC, label: AAC-ELD}
  QAU-030:
    title: "Low power statistics: island mode"
    test: platform.sleep_stat
    args: {pattern: island}
  QAU-031:
    title: "Compress offload (Ogg Vorbis)"
    test: audio.compress_codec
    args: {codec: VORBIS, label: Ogg Vorbis}
  QAU-032:
    title: "Limiter"
    test: audio.controls
    args: {feature: Limiter, patterns: [limiter]}
  QAU-033:
    title: "IIR filter"
    test: audio.controls
    args: {feature: IIR filter, patterns: [\bIIR]}
  QAU-034:
    title: "FastRPC to the audio DSP (shell case)"
    test: audio.case
    args: {case: fastrpc}
  QAU-035:
    title: "QACT: Real time data and resource monitoring"
    test: audioreach.qact
    args: {feature: Real time data and resource monitoring}
  QAU-036:
    title: "Centralised protection system"
    test: audio.controls
    args: {feature: Centralised protection system, patterns: [CPS, protect]}
  QAU-037:
    title: "Echo reference"
    test: audio.controls
    args: {feature: Echo reference, patterns: ['EC_?REF', ECHO, REFERENCE]}
  QAU-038:
    title: "Audio DSP firmware packaged"
    test: platform.firmware_packaged
    args: {paths: [/lib/firmware/qcom/*/*adsp*, /lib/firmware/qcom/*/*/*adsp*, /lib/firmware/qcom/*/*tplg*, /lib/firmware/qcom/*/*/*tplg*]}
  QAU-039:
    title: "TDM/PCM audio interface, end to end and through a stub codec"
    tests:
    - {test: audio.case, args: {case: interface-tdm}}
    - {test: audio.case, args: {case: interface-tdm-stub}}
  QAU-040:
    title: "I2S audio interface, end to end and through a stub codec"
    tests:
    - {test: audio.case, args: {case: interface-i2s}}
    - {test: audio.case, args: {case: interface-i2s-stub-playback}}
    - {test: audio.case, args: {case: interface-i2s-stub-capture}}
  QVI-001:
    title: "Wi-Fi Display back channel (source)"
    test: platform.no_interface
    args: {feature: Wi-Fi Display back channel (source), interface: no Wi-Fi Display (Miracast) session manager on the image, look: [/usr/bin/*wfd*, /usr/lib/*wfd*, /usr/bin/*miracast*]}
  QVI-002:
    title: "Wi-Fi Display back channel (sink)"
    test: platform.no_interface
    args: {feature: Wi-Fi Display back channel (sink), interface: no Wi-Fi Display (Miracast) session manager on the image, look: [/usr/bin/*wfd*, /usr/lib/*wfd*, /usr/bin/*miracast*]}
  QVI-003:
    title: "Wi-Fi Display sink"
    test: platform.no_interface
    args: {feature: Wi-Fi Display sink, interface: no Wi-Fi Display (Miracast) session manager on the image, look: [/usr/bin/*wfd*, /usr/lib/*wfd*, /usr/bin/*miracast*]}
  QVI-004:
    title: "RTCP in a Wi-Fi Display session"
    test: platform.no_interface
    args: {feature: RTCP in a Wi-Fi Display session, interface: no Wi-Fi Display (Miracast) session manager on the image, look: [/usr/bin/*wfd*, /usr/lib/*wfd*, /usr/bin/*miracast*]}
  QVI-005:
    title: "Region of interest encoding"
    test: platform.no_interface
    args: {feature: Region of interest encoding, interface: V4L2 has no region of interest QP control upstream}
  QVI-006:
    title: "Wi-Fi Display TCP/UDP transport switching"
    test: platform.no_interface
    args: {feature: Wi-Fi Display TCP/UDP transport switching, interface: no Wi-Fi Display (Miracast) session manager on the image, look: [/usr/bin/*wfd*, /usr/lib/*wfd*, /usr/bin/*miracast*]}
  QVI-007:
    title: "Blur filter"
    test: platform.no_interface
    args: {feature: Blur filter, interface: V4L2 has no blur control upstream}
  QVI-008:
    title: "Wi-Fi Display source"
    test: platform.no_interface
    args: {feature: Wi-Fi Display source, interface: no Wi-Fi Display (Miracast) session manager on the image, look: [/usr/bin/*wfd*, /usr/lib/*wfd*, /usr/bin/*miracast*]}
  QVI-009:
    title: "Wi-Fi Display content protection (source)"
    test: platform.no_interface
    args: {feature: Wi-Fi Display content protection (source), interface: no Wi-Fi Display (Miracast) session manager on the image, look: [/usr/bin/*wfd*, /usr/lib/*wfd*, /usr/bin/*miracast*]}
  QVI-010:
    title: "Wi-Fi Display content protection (sink)"
    test: platform.no_interface
    args: {feature: Wi-Fi Display content protection (sink), interface: no Wi-Fi Display (Miracast) session manager on the image, look: [/usr/bin/*wfd*, /usr/lib/*wfd*, /usr/bin/*miracast*]}
  QVI-011:
    title: "Wi-Fi Display mDNS discovery"
    test: platform.no_interface
    args: {feature: Wi-Fi Display mDNS discovery, interface: no Wi-Fi Display (Miracast) session manager on the image, look: [/usr/bin/*wfd*, /usr/lib/*wfd*, /usr/bin/*miracast*]}
  QVI-012:
    title: "Third party certification"
    test: platform.no_interface
    args: {feature: Third party certification, interface: 'a certification process, not a device interface'}
  QVI-013:
    title: "Secure (protected) video"
    test: platform.no_interface
    args: {feature: Secure (protected) video, interface: no protected buffer path in the upstream V4L2 stateful codec API, look: [/dev/dma_heap/*secure*, /dev/dma_heap/*protected*]}
  QVI-014:
    title: "Multimedia resource manager"
    test: platform.no_interface
    args: {feature: Multimedia resource manager, interface: no cross-device multimedia bandwidth arbiter interface upstream}
  QVI-015:
    title: "Fences for video decode"
    test: platform.no_interface
    args: {feature: Fences for video decode, interface: V4L2 has no explicit synchronisation (fence) support upstream}
  QCA-001:
    title: "CamX camera driver"
    test: camx.kmd
  QCA-002:
    title: "CamX camera service"
    test: camx.service
    target: {restarts: {max: 0}}
  QCA-003:
    title: "CamX preview"
    test: camx.preview
  QCA-004:
    title: "CamX capture"
    test: camx.capture
  QCA-005:
    title: "CamX concurrent cameras"
    test: camx.concurrent
  QCA-006:
    title: "CamX sensor probe: first profile sensor"
    test: camx.sensor
    args: {sensor: 0}
  QCA-007:
    title: "CamX sensor probe: second profile sensor"
    test: camx.sensor
    args: {sensor: 1}
  QCA-008:
    title: "CamX raw capture: first profile sensor"
    test: camx.raw
    args: {sensor: 0}
  QCA-009:
    title: "CamX raw capture: second profile sensor"
    test: camx.raw
    args: {sensor: 1}
  QCA-010:
    title: "CamX sensor mounting orientation"
    test: camx.orientation
  QCA-011:
    title: "CamX ISP snapshot (JPEG)"
    test: camx.snapshot
  QCA-012:
    title: "CamX ISP preview (YUV 4:2:0)"
    test: camx.yuv
  QCA-013:
    title: "CamX ISP frames without hardware failures"
    test: camx.isp_log
  QCA-014:
    title: "CamX ISP preview frame rate"
    test: camx.fps
  QCA-015:
    title: "CamX ICP firmware load through the TEE PAS"
    test: camx.icp_fw
  QCA-016:
    title: "CamX power cycle across repeated opens"
    test: camx.power
    args: {runs: 3}
  QCA-017:
    title: "CamX power up after a reboot"
    test: camx.power
    args: {runs: 1, boot: true}
  QCA-018:
    title: "CamX ISP first frame after a camera power up"
    test: camx.first_frame
  QCA-019:
    title: "CamX missing ICP firmware fails cleanly"
    test: camx.no_firmware
  QCA-020:
    title: "CamX ISP 4K video frames intact"
    test: camx.video
  QCA-021:
    title: "CamX burst snapshot"
    test: camx.streams
    args: {command: burst}
  QCA-022:
    title: "CamX timelapse snapshots"
    test: camx.streams
    args: {command: timelapse}
  QCA-023:
    title: "CamX ZSL snapshot"
    test: camx.streams
    args: {command: zsl, report: {zsl: 1}}
  QCA-024:
    title: "CamX non-ZSL snapshot"
    test: camx.streams
    args: {command: nzsl, report: {zsl: 0}}
  QCA-025:
    title: "CamX live snapshot during video"
    test: camx.streams
    args: {command: live-snapshot}
  QCA-026:
    title: "CamX JPEG and RAW from one capture"
    test: camx.streams
    args: {command: jpeg-raw}
  QCA-027:
    title: "CamX YUV preview with a Bayer RAW capture"
    test: camx.streams
    args: {command: yuv-raw}
  QCA-028:
    title: "CamX two sensors in one session"
    test: camx.streams
    args: {command: dual}
  QCA-029:
    title: "CamX two video streams from one camera"
    test: camx.streams
    args: {command: video-dual}
  QCA-030:
    title: "CamX 10-bit P010 video"
    test: camx.streams
    args: {command: video-p010}
  QCA-031:
    title: "CamX HDR sensor mode session"
    test: camx.streams
    args: {command: shdr, unverified: the HDR exposures and their merge are not measured without an HDR scene}
  QCA-032:
    title: "CamX HLG video request"
    test: camx.streams
    args: {command: video-hlg, report: {hdr_profile: 2}, unverified: the HLG transfer of the P010 frames is not measured}
  QCA-033:
    title: "CamX auto exposure follows the exposure compensation"
    test: camx.phases
    args: {command: aec, expect: [up, down], step: 1.15, bounds: [25, 200], report: {ae: 'ON'}}
  QCA-034:
    title: "CamX manual exposure time"
    test: camx.phases
    args: {command: manual-exp, expect: [up], step: 1.5, report: {exposure: 30000000, ae: 'OFF'}}
  QCA-035:
    title: "CamX auto white balance (grey world)"
    test: camx.phases
    args: {command: awb, stat: grey, bounds: [0, 20], report: {awb: AUTO}}
  QCA-036:
    title: "CamX manual white balance by colour temperature"
    test: camx.phases
    args: {command: manual-wb, stat: chroma, expect: [moves], step: 4, report: {awb: 'OFF'}}
  QCA-037:
    title: "CamX basic 3A: auto exposure and auto white balance"
    tests:
    - {test: camx.phases, args: {command: aec, expect: [up, down], step: 1.15, bounds: [25, 200], report: {ae: 'ON'}}}
    - {test: camx.phases, args: {command: awb, stat: grey, bounds: [0, 20], report: {awb: AUTO}}}
  QCA-038:
    title: "CamX manual 3A: manual exposure and white balance"
    tests:
    - {test: camx.phases, args: {command: manual-exp, expect: [up], step: 1.5, report: {exposure: 30000000, ae: 'OFF'}}}
    - {test: camx.phases, args: {command: manual-wb, stat: chroma, expect: [moves], step: 4, report: {awb: 'OFF'}}}
  QCA-039:
    title: "CamX JPEG quality control"
    test: camx.phases
    args: {command: jpeg-quality, stat: dqt, expect: [up], step: 1.5, report: {jpeg_quality: 50}}
  QCA-040:
    title: "CamX preview exposure simulation at the normal frame rate (manual long exposure)"
    test: camx.phases
    args: {command: ev-sim, expect: [up], step: 1.2, fps: 27}
  QCA-041:
    title: "CamX preview exposure simulation at the normal frame rate (shutter priority)"
    test: camx.phases
    args: {command: ev-sim-sp, expect: [same], step: 1.5, fps: 27}
  QCA-042:
    title: "CamX digital zoom"
    test: camx.zoom
    args: {command: zoom, zoom: 2.0}
  QCA-043:
    title: "CamX ISP 1080p video frames intact"
    test: camx.video
    args: {command: video-1080}
  QCA-044:
    title: "CamX ISP 4K preview"
    test: camx.yuv
    args: {command: preview-4k}
  QCA-045:
    title: "CamX high frame rate video"
    test: camx.fps
    args: {command: hfr}
  QCA-046:
    title: "CamX 4K30 video encoded on the V4L2 encoder"
    test: camx.video_encode
    args: {command: video-4k-enc, codec: HEVC}
  QCA-047:
    title: "CamX noise reduction controls (NR, MCTF, MFNR, MMF)"
    test: platform.no_interface
    args: {feature: CamX noise reduction controls, interface: the CamX test client sets no noise reduction mode or MCTF switch and reads back nothing that shows MFNR or MMF ran}
  QCA-048:
    title: "CamX face detection results"
    test: platform.no_interface
    args: {feature: CamX face detection, interface: the CamX test client can ask for face detection but prints no face results}
  QCA-049:
    title: "CamX super resolution (still and video)"
    test: platform.no_interface
    args: {feature: CamX super resolution, interface: the CamX test client has no super resolution request}
  QCA-050:
    title: "CamX frame rate range change within a session"
    test: platform.no_interface
    args: {feature: CamX dynamic frame rate, interface: the CamX test client sets the frame rate range only when it opens a camera}
  QCA-051:
    title: "CamX seamless sensor mode switch"
    test: platform.no_interface
    args: {feature: CamX seamless sensor mode switch, interface: the CamX test client has no command that changes the sensor mode within a session}
  QCA-052:
    title: "CamX offline reprocessing API"
    test: platform.no_interface
    args: {feature: CamX offline reprocessing, interface: the CamX test client has no input stream to reprocess an image through the offline ISP}
  QCA-053:
    title: "CamX YUV 4:2:2 output"
    test: platform.no_interface
    args: {feature: CamX YUV 4:2:2 output, interface: the CamX test client has no YUV 4:2:2 stream format}
  QCA-054:
    title: "CamX MJPEG stream"
    test: platform.no_interface
    args: {feature: CamX MJPEG stream, interface: the CamX test client has no MJPEG stream (JPEG is a snapshot stream only)}
  QCA-055:
    title: "CamX ML ISP"
    test: platform.no_interface
    args: {feature: CamX ML ISP, interface: the CamX test client has no ML ISP request}
  QCA-056:
    title: "CamX hyperlapse with frame selection"
    test: platform.no_interface
    args: {feature: CamX hyperlapse, interface: the CamX test client has no hyperlapse mode}
  QCA-057:
    title: "Camera sensor register access from user space"
    test: platform.no_interface
    args: {feature: Camera sensor register access, interface: no device node or CamX test client command reads or writes camera sensor registers from user space}
