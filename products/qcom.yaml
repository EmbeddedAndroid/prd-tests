    test: camx.hardware
    args: {feature: CamX lens shading and distortion correction, hw: camera-chart}
  QCA-061:
    title: "CamX image stabilization"
    test: camx.hardware
    args: {feature: CamX image stabilization, hw: camera-motion}
  QCA-062:
    title: "CamX LED flash"
    test: camx.hardware
    args: {feature: CamX LED flash, hw: camera-flash}
  QCA-063:
    title: "CamX autofocus and PDAF"
    test: camx.hardware
    args: {feature: CamX autofocus, hw: camera-af-lens}
  QCA-064:
    title: "CamX IR and RGB-IR cameras, IR LED and IR cut filter"
    test: camx.hardware
    args: {feature: CamX IR cameras, hw: camera-ir}
  QCA-065:
    title: "CamX GMSL cameras and CSI virtual channels"
    test: camx.hardware
    args: {feature: CamX GMSL cameras, hw: camera-gmsl}
  QCA-066:
    title: "CamX camera hot plug"
    test: camx.hardware
    args: {feature: CamX camera hot plug, hw: camera-hotplug}
  QCA-067:
    title: "CamX YUV, quad CFA, in-sensor zoom and DCG sensors"
    test: camx.hardware
